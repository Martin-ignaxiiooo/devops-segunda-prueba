sonar.projectKey=ep02-devops
sonar.projectName=EP2 DevOps - Empresas EP1
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src/test
sonar.exclusions=frontend/src/test/**,**/node_modules/**,**/build/**,**/dist/**
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
sonar.java.libraries=backend/build/sonar-libraries/*.jar
sonar.java.test.libraries=backend/build/sonar-libraries/*.jar
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=frontend/src/main.jsx
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
