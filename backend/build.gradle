buildscript {
    configurations.classpath {
        resolutionStrategy.force(
            'org.apache.httpcomponents.core5:httpcore5:5.4.3',
            'org.apache.httpcomponents.core5:httpcore5-h2:5.4.3',
            'org.apache.httpcomponents.client5:httpclient5:5.6.3',
            'org.apache.commons:commons-lang3:3.18.0'
        )
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'jacoco'
}

group = 'cl.duocuc.ep02'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.0.9')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    runtimeOnly 'org.postgresql:postgresql:42.7.12'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'

    testImplementation 'io.cucumber:cucumber-java:8.0.4'
    testImplementation 'io.cucumber:cucumber-spring:8.0.4'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.4'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-suite-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

test {
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: ['**/*Application.class']) }))
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(dir: it, exclude: ['**/*Application.class']) }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.00
            }
        }
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

// El analizador recibe las mismas bibliotecas que utilizan las pruebas.
tasks.register('sonarLibraries', Copy) {
    from configurations.testRuntimeClasspath
    into layout.buildDirectory.dir('sonar-libraries')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
