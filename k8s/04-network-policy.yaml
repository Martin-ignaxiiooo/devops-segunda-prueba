apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-solo-backend
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: ep02-database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ep02-backend
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-solo-frontend
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: ep02-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ep02-frontend
      ports:
        - protocol: TCP
          port: 8080
