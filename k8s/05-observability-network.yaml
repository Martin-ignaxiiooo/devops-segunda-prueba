apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-monitoring
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: ep02-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ep3-prometheus
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-monitoring
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: ep02-database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ep3-alloy
      ports:
        - protocol: TCP
          port: 5432
