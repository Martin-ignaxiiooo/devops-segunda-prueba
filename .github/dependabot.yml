version: 2
updates:
- package-ecosystem: gradle
  directory: /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    mantenimiento:
      patterns:
      - '*'
    seguridad:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    mantenimiento:
      patterns:
      - '*'
    seguridad:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
