    mantenimiento:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    mantenimiento:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /database
  schedule:
    interval: weekly
  open-pull-requests-limit: 1
  groups:
    mantenimiento:
      patterns:
      - '*'
- package-ecosystem: github-actions
