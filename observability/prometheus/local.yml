global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
scrape_configs:
  - job_name: empresas-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ep02-backend:8080]
        labels:
          service: backend
          environment: local
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
